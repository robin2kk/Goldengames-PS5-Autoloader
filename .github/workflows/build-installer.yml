name: Build Goldengames Installer ELF

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Goldengames overlay
        uses: actions/checkout@v4

      - name: Prepare exact upstream v0.3.0 tree
        run: bash tools/prepare_upstream.sh

      - name: Apply Goldengames registry and app identity
        run: python3 tools/apply_goldengames_build.py work/ps5-webkit-autoloader

      - name: Verify patched runtime auto-starts etaHEN and preserves manual mode
        run: |
          set -euo pipefail
          APP=work/ps5-webkit-autoloader/frontend/autoloader/app.js
          UMTX_APPLY=work/ps5-webkit-autoloader/tools/apply_umtx2_patch.sh
          INDEX=work/ps5-webkit-autoloader/frontend/autoloader/index.html
          grep -Fq "choosePayload('etahen-2.5B.bin', 'AUTO JAILBREAK · etaHEN 2.5B', true)" "$APP"
          grep -Fq "sessionStorage.setItem('wkal_autoload', selectedPayload)" "$APP"
          grep -Fq "goldengames_sender_only" "$APP"
          grep -Fq "JAILBROKEN" "$APP"
          grep -Fq "etaHEN 2.5B LAUNCHED" "$APP"
          grep -Fq "goldengamesSenderOnly" "$UMTX_APPLY"
          grep -Fq "var wkalAutoloadPort = 9021;" "$UMTX_APPLY"
          grep -Fq "payload bytes loaded" "$UMTX_APPLY"
          grep -Fq "send completed to port" "$UMTX_APPLY"
          grep -Fq "v0.5.6-test" "$INDEX"
          node --check "$APP"

      - name: Download exact official payloads
        run: |
          set -euo pipefail
          mkdir -p payloads
          curl -fL --retry 3 -o payloads/etahen-2.5B.bin \
            https://github.com/etaHEN/etaHEN/releases/download/2.5B/etaHEN-2.5B.bin
          curl -fL --retry 3 -o payloads/kstuff-1.10.elf \
            https://github.com/EchoStretch/kstuff-lite/releases/download/v1.10/kstuff.elf

      - name: Verify exact payload hashes
        run: python3 tools/verify_payloads.py

      - name: Stage verified payloads into Goldengames frontend
        run: |
          mkdir -p work/ps5-webkit-autoloader/frontend/autoloader/payloads
          cp payloads/etahen-2.5B.bin work/ps5-webkit-autoloader/frontend/autoloader/payloads/etahen-2.5B.bin
          cp payloads/kstuff-1.10.elf work/ps5-webkit-autoloader/frontend/autoloader/payloads/kstuff-1.10.elf

      - name: Build installer via upstream Docker SDK
        working-directory: work/ps5-webkit-autoloader
        env:
          BUILD_TYPE: dev
          FORCE_EXPLOIT: auto
          CUSTOM_VERSION: goldengames-v0.5.6-test
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker build -t ps5-webkit-autoloader-sdk -f Dockerfile.sdk .
          docker run --rm -u "$(id -u):$(id -g)" \
            -e BUILD_TYPE -e FORCE_EXPLOIT -e CUSTOM_VERSION -e GITHUB_TOKEN \
            -v "$PWD":/src -w /src ps5-webkit-autoloader-sdk make clean all
          test -f installer.elf
          mv installer.elf goldengames-ps5-autoloader-installer_v0.5.6-test.elf

      - name: Verify staged frontend and built ELF
        working-directory: work/ps5-webkit-autoloader
        run: |
          set -euo pipefail
          ELF=goldengames-ps5-autoloader-installer_v0.5.6-test.elf
          VERSION="$(cat frontend/dist/VERSION)"
          APP="frontend/dist/app/${VERSION}/app.js"
          UMTX_MAIN="frontend/dist/app/${VERSION}/umtx2/main.js"
          INDEX="frontend/dist/app/${VERSION}/index.html"
          STRINGS_FILE="$RUNNER_TEMP/goldengames-installer.strings"

          test -f "$ELF"
          test -f "$APP"
          test -f "$UMTX_MAIN"
          test -f "$INDEX"

          grep -Fq "choosePayload('etahen-2.5B.bin', 'AUTO JAILBREAK · etaHEN 2.5B', true)" "$APP"
          grep -Fq "sessionStorage.setItem('wkal_autoload', selectedPayload)" "$APP"
          grep -Fq "goldengames_sender_only" "$APP"
          grep -Fq "JAILBROKEN" "$APP"
          grep -Fq "etaHEN 2.5B LAUNCHED" "$APP"
          grep -Fq "v0.5.6-test" "$INDEX"
          node --check "$APP"

          echo 'Checking manual sender mode and payload routing to elfldr 9021...'
          grep -Fq 'var goldengamesSenderOnly = false;' "$UMTX_MAIN"
          grep -Fq 'jailbreak already active; sender-only mode enabled' "$UMTX_MAIN"
          grep -Fq 'var wkalAutoloadPort = 9021;' "$UMTX_MAIN"
          grep -Fq 'var wkalAutoloadReady = await probe_sb_elfldr();' "$UMTX_MAIN"
          grep -Fq 'Goldengames diag: payload bytes loaded = ' "$UMTX_MAIN"
          grep -Fq 'Goldengames diag: sending ' "$UMTX_MAIN"
          grep -Fq 'Goldengames diag: send completed to port ' "$UMTX_MAIN"
          grep -Fq 'toPort: 9021' "$UMTX_MAIN"

          strings "$ELF" > "$STRINGS_FILE"
          grep -Fq 'GGAU00001' "$STRINGS_FILE"
          if grep -Fq 'WKAL00001' "$STRINGS_FILE"; then
            echo 'ERROR: upstream WKAL00001 leaked into Goldengames installer' >&2
            exit 1
          fi
          grep -Fq 'etahen-2.5B.bin' "$STRINGS_FILE"
          grep -Fq 'kstuff-1.10.elf' "$STRINGS_FILE"
          sha256sum "$ELF"

      - name: Upload installer ELF
        uses: actions/upload-artifact@v4
        with:
          name: goldengames-ps5-autoloader-installer-v0.5.6-test
          path: work/ps5-webkit-autoloader/goldengames-ps5-autoloader-installer_v0.5.6-test.elf
          if-no-files-found: error
