name: Build Goldengames Installer ELF v1.0.1 from RC7

on:
  push:
    branches: [agent/import-v0.5]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact proven RC7 source
        uses: actions/checkout@v4
        with:
          ref: b0687af09b3619e26f654f9ee03ecfce7058638c

      - name: Change labels only to v1.0.1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('overlay/frontend/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Goldengames PS5 Autoloader v1.0.0 RC7', 'Goldengames PS5 Autoloader v1.0.1')
          s = s.replace('v1.0.0-rc7', 'v1.0.1')
          s = s.replace('Goldengames v1.0.0-rc7', 'Goldengames v1.0.1')
          s = s.replace('RC7 safety: reopening Goldengames never repeats Auto Jailbreak after a successful etaHEN launch. Manual payload mode verifies elfldr before sending.', 'Auto Jailbreak uses etaHEN 2.5B. Reopening Goldengames keeps manual payload mode available for the active session.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Prepare exact RC7 upstream tree
        run: bash tools/prepare_upstream.sh

      - name: Apply Goldengames RC7 native integration
        run: python3 tools/apply_goldengames_build.py work/ps5-webkit-autoloader

      - name: Enable RC7 payload set
        run: python3 tools/enable_release_payloads.py work/ps5-webkit-autoloader

      - name: Verify exact proven RC7 behavior is preserved
        run: |
          set -euo pipefail
          APP=work/ps5-webkit-autoloader/frontend/autoloader/app.js
          INDEX=work/ps5-webkit-autoloader/frontend/autoloader/index.html
          grep -Fq 'RC7 safety rule' "$APP"
          grep -Fq "'SESSION READY'" "$APP"
          grep -Fq 'sender will verify elfldr 9021' "$APP"
          grep -Fq '<title>Goldengames PS5 Autoloader v1.0.1</title>' "$INDEX"
          grep -Fq '<strong>v1.0.1</strong>' "$INDEX"
          if grep -Fqi 'v1.0.0-rc7' "$INDEX"; then
            echo 'ERROR: RC7 version label leaked into v1.0.1 dashboard' >&2
            exit 1
          fi
          node --check "$APP"

      - name: Download exact pinned payloads
        run: |
          set -euo pipefail
          mkdir -p payloads
          curl -fL --retry 3 -o payloads/etahen-2.5B.bin https://github.com/etaHEN/etaHEN/releases/download/2.5B/etaHEN-2.5B.bin
          curl -fL --retry 3 -o payloads/etahen-2.6B.bin https://raw.githubusercontent.com/nexgen999/PS5_Payload_Manager_Updater/main/ps5_hen_loader/etaHEN-2.6B.bin
          curl -fL --retry 3 -o payloads/kstuff-1.10.elf https://github.com/EchoStretch/kstuff-lite/releases/download/v1.10/kstuff.elf
          curl -fL --retry 3 -o payloads/pldmgr_v0.5.1.elf https://github.com/itsPLK/ps5-payload-manager/releases/download/v0.5.1/pldmgr_v0.5.1.elf
          curl -fL --retry 3 -o payloads/websrv-ps5.elf https://github.com/ps5-payload-dev/websrv/releases/download/v0.34/websrv-ps5.elf
          curl -fL --retry 3 -o payloads/shadowmountplus_v1.7alpha8.elf https://nexgen999.github.io/PS5-Super-PLDMGR-Auto-Updater/payloads/ps5_game_dump/ShadowMountPlus/1.7alpha8/shadowmountplus_v1.7alpha8.elf
          python3 tools/verify_payloads.py

      - name: Stage payloads
        run: |
          mkdir -p work/ps5-webkit-autoloader/frontend/autoloader/payloads
          cp payloads/* work/ps5-webkit-autoloader/frontend/autoloader/payloads/

      - name: Build v1.0.1 installer from proven RC7
        working-directory: work/ps5-webkit-autoloader
        env:
          BUILD_TYPE: dev
          FORCE_EXPLOIT: auto
          CUSTOM_VERSION: goldengames-v1.0.1
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker build -t ps5-webkit-autoloader-sdk -f Dockerfile.sdk .
          docker run --rm -u "$(id -u):$(id -g)" -e BUILD_TYPE -e FORCE_EXPLOIT -e CUSTOM_VERSION -e GITHUB_TOKEN -v "$PWD":/src -w /src ps5-webkit-autoloader-sdk make clean all
          test -f installer.elf
          mv installer.elf goldengames-ps5-autoloader-installer_v1.0.1.elf
          sha256sum goldengames-ps5-autoloader-installer_v1.0.1.elf

      - name: Verify built v1.0.1
        working-directory: work/ps5-webkit-autoloader
        run: |
          set -euo pipefail
          VERSION="$(cat frontend/dist/VERSION)"
          APP="frontend/dist/app/${VERSION}/app.js"
          UMTX="frontend/dist/app/${VERSION}/umtx2/main.js"
          INDEX="frontend/dist/app/${VERSION}/index.html"
          grep -Fq 'RC7 safety rule' "$APP"
          grep -Fq 'var wkalAutoloadReady = await probe_sb_elfldr();' "$UMTX"
          grep -Fq 'goldengamesSenderOnly' "$UMTX"
          grep -Fq 'toPort: 9021' "$UMTX"
          grep -Fq '<title>Goldengames PS5 Autoloader v1.0.1</title>' "$INDEX"

      - name: Upload v1.0.1 installer
        uses: actions/upload-artifact@v4
        with:
          name: goldengames-ps5-autoloader-installer-v1.0.1
          path: work/ps5-webkit-autoloader/goldengames-ps5-autoloader-installer_v1.0.1.elf
          if-no-files-found: error
