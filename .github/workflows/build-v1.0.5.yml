name: Build Goldengame v1.0.5 Test2 + Fixed PS5 App Icon

on:
  push:
    branches: [v1.0.5-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact proven Test2 visual files and apply cache-busted icon
        run: |
          set -euo pipefail
          BASE=04dc5d5068f7e17a3383ca7a687d9ed0e6d837e3
          curl -fL "https://raw.githubusercontent.com/robin2kk/Goldengames-PS5-Autoloader/${BASE}/overlay/frontend/index.html" -o overlay/frontend/index.html
          curl -fL "https://raw.githubusercontent.com/robin2kk/Goldengames-PS5-Autoloader/${BASE}/overlay/installer-page/index.html" -o overlay/installer-page/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('overlay/frontend/index.html')
          s = p.read_text()
          s = s.replace('<link rel="icon" type="image/svg+xml" href="favicon.svg" />', '<link rel="icon" type="image/svg+xml" href="gg-logo.svg" />')
          s = s.replace('<img class="logo" src="jb-icon.svg" alt="AJ" />', '<img class="logo" src="gg-logo.svg" alt="Goldengames" />')
          s = s.replace('<div class="brand"><img src="jb-icon.svg" alt="AJ" />', '<div class="brand"><img src="gg-logo.svg" alt="Goldengames" />')
          s = s.replace('<div class="miniBrand"><img src="jb-icon.svg" alt="AJ" />', '<div class="miniBrand"><img src="gg-logo.svg" alt="Goldengames" />')
          s = s.replace('<span class="heroIcon" aria-hidden="true"><img src="jb-icon.svg" alt="" /></span>', '<span class="heroIcon" aria-hidden="true"><img src="etahen26-icon.svg" alt="etaHEN 2.6B" /></span>')
          p.write_text(s)

          p = Path('overlay/installer-page/index.html')
          s = p.read_text().replace('/jb-icon.svg', '/gg-logo.svg')
          p.write_text(s)

          p = Path('overlay/frontend/test2.css')
          s = p.read_text().replace('url("jb-icon.svg")', 'url("etahen26-icon.svg")')
          p.write_text(s)
          PY

      - name: Prepare upstream v0.3.1 with exact Test2 overlay
        run: bash tools/prepare_upstream.sh

      - name: Apply Goldengames native integration
        run: python3 tools/apply_goldengames_build.py work/ps5-webkit-autoloader

      - name: Enable manual payload set
        run: python3 tools/enable_release_payloads.py work/ps5-webkit-autoloader

      - name: Apply proven stability fixes and etaHEN 2.6B
        run: |
          python3 tools/v102_autostart_fix.py work/ps5-webkit-autoloader
          python3 tools/v103_stability_fix.py work/ps5-webkit-autoloader
          python3 tools/v104_memory_fix.py work/ps5-webkit-autoloader
          python3 tools/v105_etahen26_upstream031.py work/ps5-webkit-autoloader

      - name: Verify Test2 UI and corrected PS5 app icon
        run: |
          set -euo pipefail
          APP=work/ps5-webkit-autoloader/frontend/autoloader/app.js
          INDEX=work/ps5-webkit-autoloader/frontend/autoloader/index.html
          THEME=work/ps5-webkit-autoloader/frontend/autoloader/test2.css
          ICON=work/ps5-webkit-autoloader/frontend/autoloader/etahen26-icon.svg
          APPICON=work/ps5-webkit-autoloader/assets/icon.svg
          grep -Fq 'test2.css' "$INDEX"
          ! grep -Fq 'test3.css' "$INDEX"
          ! grep -Fq 'test4.css' "$INDEX"
          ! grep -Fq 'test5.css' "$INDEX"
          grep -Fq 'src="etahen26-icon.svg"' "$INDEX"
          grep -Fq 'url("etahen26-icon.svg")' "$THEME"
          test -s "$ICON"
          grep -Fq '>etaHEN</text>' "$ICON"
          grep -Fq '>2.6B</text>' "$ICON"
          test -s "$APPICON"
          grep -Fq 'viewBox="180 35 440 440"' "$APPICON"
          grep -Fq '>GOLDENGAMES</text>' "$APPICON"
          grep -Fq '>PS5 AUTOLOADER</text>' "$APPICON"
          grep -Fq '>JAILBREAK</text>' "$APPICON"
          grep -Fq "choosePayload('etahen-2.6B.bin', 'AUTO JAILBREAK · etaHEN 2.6B', true)" "$APP"
          grep -Fq 'persistentSenderReady' "$APP"
          grep -Fq 'sendViaPersistentUmtx' "$APP"
          node --check "$APP"

      - name: Download exact pinned payloads
        run: |
          set -euo pipefail
          mkdir -p payloads
          curl -fL --retry 3 -o payloads/etahen-2.5B.bin https://github.com/etaHEN/etaHEN/releases/download/2.5B/etaHEN-2.5B.bin
          curl -fL --retry 3 -o payloads/etahen-2.6B.bin https://raw.githubusercontent.com/nexgen999/PS5_Payload_Manager_Updater/main/ps5_hen_loader/etaHEN-2.6B.bin
          curl -fL --retry 3 -o payloads/kstuff-1.10.elf https://github.com/EchoStretch/kstuff-lite/releases/download/v1.10/kstuff.elf
          curl -fL --retry 3 -o payloads/pldmgr_v0.5.1.elf https://github.com/itsPLK/ps5-payload-manager/releases/download/v0.5.1/pldmgr_v0.5.1.elf
          curl -fL --retry 3 -o payloads/websrv-ps5.elf https://github.com/ps5-payload-dev/websrv/releases/download/v0.34/websrv-ps5.elf
          curl -fL --retry 3 -o payloads/shadowmountplus_v1.7alpha8.elf https://nexgen999.github.io/PS5-Super-PLDMGR-Auto-Updater/payloads/ps5_game_dump/ShadowMountPlus/1.7alpha8/shadowmountplus_v1.7alpha8.elf
          python3 tools/verify_payloads.py

      - name: Verify etaHEN 2.6B exact binary
        run: |
          set -euo pipefail
          EXPECTED=512c74a9d6f56bb5a4ab871a0306a8cbefb8b3d5454ba8f1d833b020b245a126
          ACTUAL="$(sha256sum payloads/etahen-2.6B.bin | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"

      - name: Stage payloads
        run: |
          mkdir -p work/ps5-webkit-autoloader/frontend/autoloader/payloads
          cp payloads/* work/ps5-webkit-autoloader/frontend/autoloader/payloads/

      - name: Build Test2 fixed app icon installer
        working-directory: work/ps5-webkit-autoloader
        env:
          BUILD_TYPE: dev
          FORCE_EXPLOIT: auto
          CUSTOM_VERSION: v1.0.5-test2-app-icon-v3
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker build -t ps5-webkit-autoloader-sdk -f Dockerfile.sdk .
          docker run --rm -u "$(id -u):$(id -g)" -e BUILD_TYPE -e FORCE_EXPLOIT -e CUSTOM_VERSION -e GITHUB_TOKEN -v "$PWD":/src -w /src ps5-webkit-autoloader-sdk make clean all
          test -f installer.elf
          mv installer.elf goldengame-ps5-jailbreak-installer_v1.0.5-test2-app-icon-v3.elf
          sha256sum goldengame-ps5-jailbreak-installer_v1.0.5-test2-app-icon-v3.elf

      - name: Verify built Test2 runtime
        working-directory: work/ps5-webkit-autoloader
        run: |
          set -euo pipefail
          VERSION="$(cat frontend/dist/VERSION)"
          APP="frontend/dist/app/${VERSION}/app.js"
          INDEX="frontend/dist/app/${VERSION}/index.html"
          THEME="frontend/dist/app/${VERSION}/test2.css"
          ICON="frontend/dist/app/${VERSION}/etahen26-icon.svg"
          test -f "$APP"; test -f "$INDEX"; test -f "$THEME"; test -s "$ICON"
          grep -Fq 'src="etahen26-icon.svg"' "$INDEX"
          grep -Fq 'url("etahen26-icon.svg")' "$THEME"
          grep -Fq "choosePayload('etahen-2.6B.bin', 'AUTO JAILBREAK · etaHEN 2.6B', true)" "$APP"
          grep -Fq 'persistentSenderReady' "$APP"

      - name: Upload Test2 fixed app icon installer
        uses: actions/upload-artifact@v4
        with:
          name: goldengame-v1.0.5-test2-fixed-ps5-app-icon-v3
          path: work/ps5-webkit-autoloader/goldengame-ps5-jailbreak-installer_v1.0.5-test2-app-icon-v3.elf
          if-no-files-found: error
