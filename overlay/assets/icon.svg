<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="100%" stop-color="#FFA751" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0B0F19" />
  <g stroke="url(#techGrad)" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M 50,50 L 150,50 L 180,80 L 180,150" />
    <path d="M 750,50 L 650,50 L 620,80 L 620,150" />
    <path d="M 100,450 L 200,450 L 230,420 L 230,380" />
    <path d="M 700,450 L 600,450 L 570,420 L 570,380" />
    <circle cx="180" cy="150" r="3" fill="#00F2FE" />
    <circle cx="620" cy="150" r="3" fill="#00F2FE" />
  </g>
  <g transform="translate(400, 160)" text-anchor="middle">
    <circle r="90" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4" />
    <circle r="82" fill="none" stroke="url(#blueGrad)" stroke-width="2" stroke-dasharray="10, 5" opacity="0.6" />
    <path d="M -25,-60 C -15,-70 15,-70 25,-60 L 15,40 C 10,45 -10,45 -15,40 Z" fill="#131927" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M -20,-55 C -10,-63 10,-63 20,-55 L 12,35 C 8,38 -8,38 -12,35 Z" fill="#FFFFFF" opacity="0.9" />
    <path d="M -8,-58 L 8,-58 L 4,38 L -4,38 Z" fill="#0B0F19" />
    <path d="M -45,-30 C -80,-50 -90,0 -45,30 C -60,15 -65,-10 -45,-30 Z" fill="url(#goldGrad)" />
    <path d="M 45,-30 C 80,-50 90,0 45,30 C 60,15 65,-10 45,-30 Z" fill="url(#goldGrad)" />
    <rect x="-35" y="50" width="70" height="20" rx="10" fill="#0B0F19" stroke="url(#blueGrad)" stroke-width="1.5" />
    <text y="64" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="11" fill="#00F2FE" letter-spacing="1">v1.0.5</text>
  </g>
  <g id="BrandText" font-family="'Montserrat', 'Impact', 'Arial Black', sans-serif" text-anchor="middle">
    <text x="400" y="305" font-size="54" font-weight="900" fill="url(#goldGrad)" letter-spacing="2" stroke="#000" stroke-width="2">GOLDENGAMES</text>
    <text x="400" y="355" font-size="32" font-weight="bold" fill="url(#blueGrad)" letter-spacing="4">PS5 AUTOLOADER</text>
    <g transform="translate(400, 385)">
      <path d="M -160,0 L 160,0 L 140,35 L -140,35 Z" fill="#131927" stroke="url(#goldGrad)" stroke-width="2" />
      <text x="0" y="26" font-size="24" font-weight="bold" fill="#FF3333" letter-spacing="6" filter="url(#glow)">JAILBREAK</text>
      <g transform="translate(-115, 10) scale(0.8)" stroke="url(#goldGrad)" stroke-width="2" fill="none">
        <rect x="0" y="8" width="14" height="10" rx="2" fill="url(#goldGrad)" />
        <path d="M 3,8 L 3,4 C 3,1 7,1 7,1 L 11,2 L 11,5" />
      </g>
      <g transform="translate(100, 10) scale(0.8)" stroke="url(#goldGrad)" stroke-width="2" fill="none">
        <rect x="0" y="8" width="14" height="10" rx="2" fill="url(#goldGrad)" />
        <path d="M 3,8 L 3,4 C 3,1 7,1 7,1 L 11,2 L 11,5" />
      </g>
    </g>
