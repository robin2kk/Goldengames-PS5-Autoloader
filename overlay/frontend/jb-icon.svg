<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradados del Fondo -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111f38" />
      <stop offset="100%" stop-color="#070b12" />
    </radialGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3e5c" />
      <stop offset="50%" stop-color="#131c2b" />
      <stop offset="100%" stop-color="#0a0f18" />
    </linearGradient>

    <!-- Degradados Metálicos y de Luces -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#b0c5e3" />
      <stop offset="70%" stop-color="#415776" />
      <stop offset="100%" stop-color="#1b273a" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdd6b" />
      <stop offset="100%" stop-color="#df9800" />
    </linearGradient>

    <!-- Filtros de Brillo Neón -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Fondo Principal Estilo Interfaz PS5 -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Grupo del Contenedor del Icono con Sombra -->
  <g filter="url(#shadow)">
    <!-- Marco Exterior Robusto -->
    <rect x="64" y="64" width="384" height="384" rx="70" fill="url(#frameGrad)" stroke="#1a293d" stroke-width="4" />
    <!-- Borde de Aislamiento Interno -->
    <rect x="76" y="76" width="360" height="360" rx="58" fill="none" stroke="#0b111a" stroke-width="6" />
    <!-- Placa Central de Fibra de Carbono / Texturizada -->
    <rect x="84" y="84" width="344" height="344" rx="50" fill="#0d1420" stroke="url(#neonCyan)" stroke-width="2" stroke-opacity="0.4" />
  </g>

  <!-- Detalles de Circuitos e Indicadores LED del Marco -->
  <g opacity="0.85" filter="url(#glowCyan)">
    <!-- Esquinas iluminadas -->
    <path d="M 95 140 L 95 110 A 15 15 0 0 1 110 95 L 140 95" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 417 140 L 417 110 A 15 15 0 0 0 402 95 L 372 95" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 95 372 L 95 402 A 15 15 0 0 0 110 417 L 140 417" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 417 372 L 417 402 A 15 15 0 0 1 402 417 L 372 417" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Puntos de Conexión de los Circuitos -->
    <circle cx="155" cy="95" r="3" fill="#00f0ff" />
    <circle cx="357" cy="95" r="3" fill="#00f0ff" />
    <circle cx="95" cy="155" r="3" fill="#00f0ff" />
    <circle cx="417" cy="155" r="3" fill="#00f0ff" />
  </g>

  <!-- Pistas del Circuito Impreso (PCB Layout) en el Fondo del Icono -->
  <g opacity="0.25" stroke="#00f0ff" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 120 180 L 170 180 L 190 200" />
    <circle cx="120" cy="180" r="3" fill="#00f0ff" />
    <path d="M 392 180 L 342 180 L 322 200" />
    <circle cx="392" cy="180" r="3" fill="#00f0ff" />
    <path d="M 130 300 L 180 300 L 195 285" />
    <circle cx="130" cy="300" r="3" fill="#00f0ff" />
    <path d="M 382 300 L 332 300 L 317 285" />
    <circle cx="382" cy="300" r="3" fill="#00f0ff" />
  </g>

  <!-- Logotipo de PlayStation Estilo Emblema Metálico -->
  <g transform="translate(146, 120) scale(1.15)">
    <!-- Sombra del Logotipo -->
    <path d="M 23.5 68.2 C 38 68.2 59.5 65.1 72.5 61.2 C 82.5 58.2 92.5 53.2 92.5 45.8 C 92.5 39.5 83.5 37.1 74.5 37.1 C 55 37.1 27 42.5 10.5 46.5 C 3.5 48.2 0 50.8 0 54.5 C 0 61.8 10.5 68.2 23.5 68.2 Z" fill="#050910" opacity="0.9"/>
    <!-- Parte del Logotipo de la 'P' -->
    <path d="M 34.2 12.2 L 34.2 60.5 L 47.8 60.5 L 47.8 44.5 C 56.5 44.5 69.5 42.5 69.5 28.5 C 69.5 13.5 54.5 12.2 34.2 12.2 Z M 47.8 22.8 L 52.5 22.8 C 59.5 22.8 60.2 27.5 60.2 31.8 C 60.2 36.2 57.5 36.8 52.5 36.8 L 47.8 36.8 Z" fill="url(#metalGrad)" />
    <!-- Elipse de la 'S' en Perspectiva Isométrica -->
    <path d="M 72.5 41.2 C 58.5 44.8 31 49.5 14.5 52.5 C 10.2 53.2 8.5 54.8 8.5 56.2 C 8.5 58.2 14.5 59.8 26.5 59.8 C 45 59.8 74.5 54.5 86.5 50.8 C 90.2 49.5 91.5 48.2 91.5 46.8 C 91.5 44.5 84.5 41.2 72.5 41.2 Z" fill="url(#metalGrad)" opacity="0.95" />
  </g>

  <!-- Rayo de etaHEN (Indicador de Inyección / Payload) -->
  <path d="M 335 225 L 310 255 L 328 255 L 305 295 L 345 245 L 325 245 Z" fill="url(#neonGold)" filter="url(#glowGold)" />

  <!-- Bloque de Texto Inferior: etaHEN -->
  <text x="256" y="380" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="44" 
        fill="#ffffff" 
        letter-spacing="3" 
        text-anchor="middle"
        style="text-transform: uppercase;">
    etaHEN
  </text>

  <!-- Versión del Software: 2.6B Iluminada -->
  <rect x="211" y="398" width="90" height="24" rx="6" fill="#111c2e" stroke="url(#neonCyan)" stroke-width="1.5" />
  <text x="256" y="415" 
        font-family="monospace, monospace" 
        font-weight="700" 
        font-size="15" 
        fill="#00f0ff" 
        letter-spacing="2" 
        text-anchor="middle"
        filter="url(#glowCyan)">
    2.6B
  </text>
</svg>
