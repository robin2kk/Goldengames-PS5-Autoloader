<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f1f0ea"/><stop offset="1" stop-color="#aaa9a4"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151515"/><stop offset="1" stop-color="#292929"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="12"/></filter>
